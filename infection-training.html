<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感染症対策研修｜株式会社常笑教育システム</title>
<style>
:root{
  --orange:#F0703C;
  --orange-dark:#D9541E;
  --orange-light:#FFF1E8;
  --teal:#2A9D8F;
  --teal-dark:#218074;
  --teal-light:#E7F6F4;
  --navy:#2F3A4A;
  --ink:#333333;
  --paper:#FFFCF8;
  --line:#EAE0D5;
  --good:#3E9142;
  --bad:#D64545;
  --shadow:0 2px 10px rgba(47,58,74,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.8;
}
/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:270px;flex-shrink:0;background:var(--navy);color:#fff;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 40px;
}
.sidebar .brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px;}
.sidebar .brand small{color:#c9d1db;font-size:11px;letter-spacing:.05em;}
.sidebar .brand div{font-size:16px;font-weight:700;margin-top:4px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;
  font-size:13.5px;color:#dbe2ea;border-left:3px solid transparent;transition:.15s;
}
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:rgba(240,112,60,.18);border-left-color:var(--orange);color:#fff;font-weight:700;}
.navitem .dot{
  width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
}
.navitem.done .dot{background:var(--teal);}
.navitem.done .dot::after{content:"✓";}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:12px 32px;display:flex;align-items:center;gap:16px;
}
.progress-wrap{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--teal));width:0%;transition:width .4s;}
.progress-label{font-size:12.5px;color:#666;white-space:nowrap;font-weight:700;}

.content{max-width:880px;margin:0 auto;padding:36px 32px 100px;}
section.panel{display:none;}
section.panel.active{display:block;animation:fadein .25s;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

h1.page-title{font-size:24px;color:var(--navy);margin:0 0 6px;border-left:6px solid var(--orange);padding-left:14px;}
.page-sub{color:#888;font-size:13px;margin:0 0 26px;padding-left:20px;}
h2.sec{font-size:17px;color:var(--teal-dark);margin:28px 0 12px;display:flex;align-items:center;gap:8px;}
h2.sec::before{content:"";width:8px;height:8px;background:var(--orange);border-radius:50%;flex-shrink:0;}
p{margin:0 0 12px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.card.orange{border-top:4px solid var(--orange);}
.card.teal{border-top:4px solid var(--teal);}
.tag{display:inline-block;font-size:11px;background:var(--teal);color:#fff;padding:2px 10px;border-radius:12px;margin-right:6px;margin-bottom:6px;font-weight:700;}
.tag.route-air{background:#8E6BBF;}
.tag.route-droplet{background:#3E8ED0;}
.tag.route-contact{background:var(--orange-dark);}
.tag.route-oral{background:#C9A227;}

table{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:13.5px;}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;}
th{background:var(--teal-light);color:var(--teal-dark);}
tr:nth-child(even) td{background:#FAF7F2;}

ul.clean{margin:0 0 12px;padding-left:22px;}
ul.clean li{margin-bottom:6px;}

.checklist label{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14.5px;}
.checklist input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--teal);flex-shrink:0;}

.principle-list{list-style:none;margin:0;padding:0;counter-reset:p;}
.principle-list li{
  counter-increment:p;position:relative;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:14px 16px 14px 52px;margin-bottom:10px;font-weight:700;color:var(--navy);
}
.principle-list li::before{
  content:counter(p);position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}

textarea,input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;
  font-family:inherit;resize:vertical;background:#fff;
}
textarea:focus,input[type=text]:focus{outline:2px solid var(--teal);border-color:var(--teal);}
label.q-label{display:block;font-weight:700;color:var(--navy);margin:14px 0 6px;}

.case{background:var(--orange-light);border-radius:12px;padding:18px 20px;margin-bottom:20px;border-left:5px solid var(--orange);}
.case h3{margin:0 0 8px;font-size:15px;color:var(--orange-dark);}
.case .prompt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:14px;}

.quiz-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.quiz-item .qnum{font-size:11px;color:#999;font-weight:700;letter-spacing:.05em;}
.quiz-item .qtext{font-weight:700;color:var(--navy);margin:4px 0 10px;font-size:14.5px;}
.opt{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
.opt:hover{background:var(--teal-light);}
.opt input{accent-color:var(--teal);}
.quiz-item.correct{border-left:5px solid var(--good);}
.quiz-item.incorrect{border-left:5px solid var(--bad);}
.feedback{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:6px;display:none;}
.feedback.show{display:block;}
.feedback.good{background:#EAF6EA;color:var(--good);}
.feedback.bad{background:#FBEAEA;color:var(--bad);}

.btn{
  background:var(--orange);color:#fff;border:none;border-radius:24px;padding:11px 26px;
  font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
}
.btn:hover{background:var(--orange-dark);}
.btn.secondary{background:var(--teal);}
.btn.secondary:hover{background:var(--teal-dark);}
.btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}

.note{background:var(--teal-light);border-left:4px solid var(--teal);padding:12px 16px;border-radius:8px;font-size:13.5px;margin:14px 0;}
.warn{background:#FFF3E9;border-left:4px solid var(--orange);padding:12px 16px;border-radius:8px;font-size:13.5px;margin:14px 0;}

.closing{
  background:linear-gradient(135deg,var(--navy),#1c2531);color:#fff;border-radius:16px;
  padding:32px 30px;text-align:center;margin-top:24px;
}
.closing .msg{font-size:16px;line-height:2;font-weight:700;}
.closing .brand-line{margin-top:14px;color:var(--orange);font-weight:700;font-size:13px;letter-spacing:.05em;}

.score-summary{text-align:center;padding:20px;}
.score-circle{
  width:130px;height:130px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--teal) calc(var(--pct,0)*1%),var(--line) 0);
}
.score-circle .inner{
  width:104px;height:104px;background:#fff;border-radius:50%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
}
.score-circle .num{font-size:26px;font-weight:800;color:var(--navy);}
.score-circle .lbl{font-size:11px;color:#888;}

.footer-nav{display:flex;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);}
.footer-nav button{background:none;border:1px solid var(--line);border-radius:20px;padding:9px 18px;cursor:pointer;font-size:13.5px;color:var(--navy);}
.footer-nav button:hover{background:var(--teal-light);}

.autosave-flag{position:fixed;bottom:16px;right:20px;background:var(--navy);color:#fff;font-size:12px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);}
.autosave-flag.show{opacity:.92;}

.sig-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.sig-row > div{flex:1;min-width:180px;}
.sig-row label{font-size:12px;color:#888;display:block;margin-bottom:4px;}

@media (max-width:840px){
  .sidebar{position:fixed;left:-270px;z-index:20;transition:.25s;box-shadow:0 0 20px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .content{padding:24px 16px 100px;}
  .topbar{padding:12px 16px;}
  .menu-btn{display:inline-flex!important;}
}
.menu-btn{display:none;background:var(--navy);color:#fff;border:none;border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <small>株式会社常笑教育システム　Level1 基礎研修⑥</small>
      <div>感染症対策研修</div>
    </div>
    <div id="navlist"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">0% 完了</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="autosave-flag" id="autosaveFlag">💾 自動保存しました</div>

<script>
/* ============================================================

];

/* Disease data structured properly */
const DISEASE_LIST = [
 {route:"空気感染", routeClass:"route-air", name:"結核（結核菌）",

 {route:"飛沫感染", routeClass:"route-droplet", name:"インフルエンザ",

  care:"嘔吐物・排泄物の処理は使い捨て手袋・マスク・エプロンを着用して行う。汚染箇所は次亜塩素酸ナトリウム液で消毒。処理後は必ず手洗いを行う。"},

  care:"手洗いの徹底（排便後・食事前）、ドアノブや便座の消毒、食品の十分な加熱が予防の基本。疑わしい症状があれば早めに受診する。"},
 {route:"接触感染（その他）", routeClass:"route-contact", name:"MRSA（メチシリン耐性黄色ブドウ球菌）",

const CHECK_DAILY = [

const PRINCIPLES = [

 "広げない",

/* ---------------- state ---------------- */
let state = loadState();
let currentIndex = 0;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {visited:{}, checks:{}, texts:{}, quiz:{}, adminApproved:false};
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashAutosave();
  }catch(e){}
}
let flashTimer=null;
function flashAutosave(){
  const el=document.getElementById("autosaveFlag");
  el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>el.classList.remove("show"),1200);
}

/* ---------------- render nav ---------------- */
function renderNav(){
  const nav=document.getElementById("navlist");
  nav.innerHTML="";
  SECTIONS.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="navitem"+(i===currentIndex?" active":"")+(state.visited[s.id]?" done":"");
    div.innerHTML=`<span class="dot"></span><span>${s.title}</span>`;
    div.onclick=()=>{goTo(i); if(window.innerWidth<=840) document.getElementById("sidebar").classList.remove("open");};
    nav.appendChild(div);
  });
}

function updateProgress(){
  const total=SECTIONS.length;
  const done=SECTIONS.filter(s=>state.visited[s.id]).length;
  const pct=Math.round(done/total*100);
  document.getElementById("progressBar").style.width=pct+"%";
  document.getElementById("progressLabel").textContent=pct+"% 完了（"+done+"/"+total+"）";
}

function goTo(i){
  currentIndex=i;
  state.visited[SECTIONS[i].id]=true;
  saveState();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------------- panel builders ---------------- */
function panelWrap(inner, title, sub){
  return `<h1 class="page-title">${title}</h1><p class="page-sub">${sub||""}</p>${inner}`;
}

function footerNav(){
  const prevDisabled = currentIndex===0 ? "disabled style='opacity:.35;cursor:default'" : "";
  const nextDisabled = currentIndex===SECTIONS.length-1 ? "disabled style='opacity:.35;cursor:default'" : "";
  return `<div class="footer-nav">
    <button ${prevDisabled} onclick="goTo(${currentIndex-1})">← 前へ</button>
    <button ${nextDisabled} onclick="goTo(${currentIndex+1})">次へ →</button>
  </div>`;
}

/* ---------------- render ---------------- */
function render(){
  renderNav();
  updateProgress();
  const content=document.getElementById("content");
  const sec=SECTIONS[currentIndex];
  content.innerHTML = `<section class="panel active">${BUILDERS[sec.id]()}${footerNav()}</section>`;
  hydrate(sec.id);
}

function hydrate(id){
  // daily checklist (health section)
  const dailyList=document.getElementById("dailyCheckList");
  if(dailyList){
    dailyList.innerHTML = CHECK_DAILY.map((item,i)=>{
      const checked = state.checks["daily_"+i] ? "checked" : "";
      return `<label><input type="checkbox" data-daily="${i}" ${checked}><span>${item}</span></label>`;
    }).join("");
    dailyList.querySelectorAll("input[data-daily]").forEach(cb=>{
      cb.addEventListener("change",e=>{
        state.checks["daily_"+e.target.dataset.daily]=e.target.checked;
        saveState();
      });
    });
  }

  // generic textareas / inputs with data-* keys, namespaced by section
  const map = [
    ["textarea[data-case]", el=>"case_"+el.dataset.case+"_"+el.dataset.field],
    ["textarea[data-personal]", el=>"personal_"+el.dataset.personal],
    ["textarea[data-quiztext]", el=>"quiztext_"+el.dataset.quiztext],
    ["textarea[data-report],input[data-report]", el=>"report_"+el.dataset.report],
    ["textarea[data-admin],input[data-admin]", el=>"admin_"+el.dataset.admin],
    ["input[data-complete]", el=>"complete_"+el.dataset.complete],
  ];
  map.forEach(([sel,keyFn])=>{
    document.querySelectorAll(sel).forEach(el=>{
      const key=keyFn(el);
      if(state.texts[key]!==undefined) el.value=state.texts[key];
      el.addEventListener("input",()=>{
        state.texts[key]=el.value;
        saveState();
      });
    });
  });

  // admin approve checkbox
  const approve=document.getElementById("adminApprove");
  if(approve){
    approve.checked = !!state.adminApproved;
    approve.addEventListener("change",e=>{
      state.adminApproved=e.target.checked;
      saveState();
    });
  }

  // quiz radios restore
  if(id==="test"){
    QUIZ.forEach((q,i)=>{
      if(q.type==="text") return;
      const saved = state.quiz["q"+i];
      if(saved!==undefined){
        const radio=document.querySelector(`input[name="q${i}"][value="${saved}"]`);
        if(radio) radio.checked=true;
      }
    });
    document.querySelectorAll('#content input[type=radio]').forEach(r=>{
      r.addEventListener("change",e=>{
        const name=e.target.name;
        state.quiz[name]=e.target.value;
        saveState();
      });
    });
    const resultDiv=document.getElementById("quizResult");
    if(state.quizGraded) renderQuizResult();
  }

  // completion checklist restore
  document.querySelectorAll('input[data-donecheck]').forEach(cb=>{
    const key="donecheck_"+cb.dataset.donecheck;
    cb.checked = !!state.checks[key];
    cb.addEventListener("change",e=>{
      state.checks[key]=e.target.checked;
      saveState();
      updateScoreCircle();
    });
  });
  if(id==="complete") updateScoreCircle();
}

function updateScoreCircle(){
  const boxes=document.querySelectorAll('input[data-donecheck]');
  if(!boxes.length) return;
  let n=0; boxes.forEach(b=>{if(b.checked)n++;});
  const pct=Math.round(n/boxes.length*100);
  const circle=document.getElementById("scoreCircle");
  const num=document.getElementById("scoreNum");
  if(circle){circle.style.setProperty("--pct",pct);}
  if(num){num.textContent=pct+"%";}
}

function gradeQuiz(){
  let objectiveTotal=0, objectiveCorrect=0;
  QUIZ.forEach((q,i)=>{
    if(q.type==="text") return;
    objectiveTotal++;
    const chosen = state.quiz["q"+i];
    const el=document.getElementById("quiz"+i);
    const fb=document.getElementById("fb"+i);
    let correct=false;
    if(q.type==="tf"){
      correct = chosen === String(q.a);
    }else if(q.type==="mc"){
      correct = Number(chosen) === q.a;
    }
    if(correct) objectiveCorrect++;
    if(el){
      el.classList.remove("correct","incorrect");
      el.classList.add(chosen===undefined? "incorrect": (correct?"correct":"incorrect"));
    }
    if(fb){
      fb.classList.add("show", correct?"good":"bad");
      fb.textContent = (correct?"○ 正解です。":"× 見直しましょう。") + " " + (q.fb||"");
    }
  });
  state.quizGraded=true;
  state.quizScore = {correct:objectiveCorrect, total:objectiveTotal};
  saveState();
  renderQuizResult();
}

function renderQuizResult(){
  const resultDiv=document.getElementById("quizResult");
  if(!resultDiv || !state.quizScore) return;
  const {correct,total}=state.quizScore;
  const pct=Math.round(correct/total*100);
  resultDiv.innerHTML = `
    <div class="card teal" style="text-align:center;">
      <p style="font-size:18px;font-weight:800;color:var(--navy);margin:0;">客観式問題　正答 ${correct} / ${total}（${pct}％）</p>
      <p style="margin:6px 0 0;color:#666;font-size:13px;">記述式の設問は自己評価用です。内容を見直し、事業所内で共有してみましょう。</p>
    </div>`;
}

/* ---------------- init ---------------- */
document.getElementById("menuBtn").addEventListener("click",()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

render();
